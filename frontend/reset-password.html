<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-area="staff">
  <div class="page page-center">
    <div class="card" style="width: 100%;">
      <h1>Reset Password</h1>

      <form id="reset-form">
        <p class="subtitle">Choose a new password for your account.</p>

        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="6" required />

        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="6" required />

        <p id="reset-error" class="error-message" hidden></p>

        <button type="submit" class="btn btn-primary btn-large">Reset Password</button>
      </form>

      <p id="reset-success" class="subtitle" hidden></p>

      <p id="missing-token" class="error-message" hidden>
        This reset link is incomplete. <a href="forgot-password.html">Request a new one.</a>
      </p>

      <p style="margin-top: 16px;"><a href="login.html" class="btn btn-link">Back to login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
