<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-area="staff">
  <div class="page page-center">
    <div class="card" style="width: 100%;">
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter the email address on your account and we'll send you a link to reset your password.</p>

      <form id="request-form">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required />

        <p id="request-error" class="error-message" hidden></p>

        <button type="submit" class="btn btn-primary btn-large">Send Reset Link</button>
      </form>

      <p id="request-success" class="subtitle" hidden></p>

      <p style="margin-top: 16px;"><a href="login.html" class="btn btn-link">Back to login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
